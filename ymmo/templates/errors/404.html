{% extends "base.html" %}
{% block title %}404 — {{ _("Page introuvable") }}{% endblock %}

{% block content %}
<div class="stack" style="text-align: center; max-width: 540px; margin: var(--s-9) auto;">
  <p style="font-family: var(--font-display); font-size: clamp(5rem, 4rem + 6vw, 9rem); line-height: 1; margin: 0; color: var(--brick);">404</p>
  <h1>{{ _("Page introuvable.") }}</h1>
  <p class="muted">{{ _("La page demandée n'existe pas ou n'est plus disponible.") }}</p>
  <p>
    <a class="btn btn--primary" href="{{ url_for('public.home') }}">{{ _("Retour à l'accueil") }}</a>
    <a class="btn btn--ghost" href="{{ url_for('public.list_properties') }}">{{ _("Voir les biens") }}</a>
  </p>
</div>
{% endblock %}
