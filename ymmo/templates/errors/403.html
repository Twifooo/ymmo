{% extends "base.html" %}
{% block title %}403 — {{ _("Accès refusé") }}{% endblock %}

{% block content %}
<div class="stack" style="text-align: center; max-width: 540px; margin: var(--s-9) auto;">
  <p style="font-family: var(--font-display); font-size: clamp(5rem, 4rem + 6vw, 9rem); line-height: 1; margin: 0; color: var(--brick);">403</p>
  <h1>{{ _("Accès refusé.") }}</h1>
  <p class="muted">{{ _("Votre compte n'a pas les permissions requises pour cette page.") }}</p>
  <p><a class="btn btn--primary" href="{{ url_for('public.home') }}">{{ _("Retour à l'accueil") }}</a></p>
</div>
{% endblock %}
